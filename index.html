function render(){
  buildNav();
  const route = currentRoute();
  const app = document.getElementById('app');
  const pages = {home:pageHome, services:pageServices, industries:pageIndustries, compare:pageCompare, pricing:pagePricing, about:pageAbout, contact:pageContact};
  app.innerHTML = (pages[route]||pageHome)();
  window.scrollTo(0,0);
  requestAnimationFrame(()=>{
    document.querySelectorAll('.reveal').forEach(el=> revealObserver.observe(el));
    document.querySelectorAll('.bar-item').forEach(el=> barObserver.observe(el));
  });
  if(route==='home') runTicker();
}
const revealObserver = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); });
}, {threshold:.15});
const barObserver = new IntersectionObserver((entries,obs)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const fill = e.target.querySelector('.bar-fill');
      fill.style.width = fill.dataset.pct+'%';
      obs.unobserve(e.target);
    }
  });
}, {threshold:.4});

let tickerInterval;
function runTicker(){
  clearInterval(tickerInterval);
  const feed = document.getElementById('tickerFeed');
  const calls = document.getElementById('statCalls');
  const booked = document.getElementById('statBooked');
  if(!feed) return;
  document.getElementById('industryTicker').innerHTML = [...INDUSTRIES,...INDUSTRIES].map(i=>`<span class="whitespace-nowrap">${i.name}</span>`).join('<span class="mx-2">·</span>');
  const names = ['Rohit S.','Ananya K.','Meera P.','Arjun V.','Divya R.','Kabir M.'];
  const outcomes = ['Meeting booked','Qualified — handed to sales','Renewal confirmed','Query resolved','Callback scheduled'];
  let c = 1280, b = 34;
  function tick(){
    c += Math.floor(Math.random()*4)+1; b += Math.random()<0.3?1:0;
    calls.textContent = c.toLocaleString('en-IN'); booked.textContent = b.toLocaleString('en-IN');
    const row = `<div class="flex items-center justify-between text-slate-400 bg-white/5 rounded-lg px-3 py-2"><span>${names[Math.floor(Math.random()*names.length)]}</span><span class="text-brand2">${outcomes[Math.floor(Math.random()*outcomes.length)]}</span></div>`;
    feed.insertAdjacentHTML('afterbegin', row);
    while(feed.children.length>4) feed.removeChild(feed.lastChild);
  }
  tick();
  tickerInterval = setInterval(tick, 2200);
}

      <ul class="space-y-2.5 mb-6">
        ${Object.values(useCases).map(u=>`<li class="flex items-start gap-2 text-sm"><span class="text-good mt-0.5">${svgIcon('check','w-4 h-4')}</span><span>${u}</span></li>`).join('')}

    </div>`;
  document.getElementById('modalBg').classList.remove('hidden'); document.getElementById('modalBg').classList.add('flex');
}
function closeModal(){ document.getElementById('modalBg').classList.add('hidden'); document.getElementById('modalBg').classList.remove('flex'); }
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

function pageContact(){

              <option value="">Industry (optional)</option>
              ${INDUSTRIES.map(i=>`<option>${i.name}</option>`).join('')}
            </select>
          </div>
          <div><textarea id="cf-msg" rows="4" placeholder="What kind of calls are you hoping to automate?" class="w-full border border-border rounded-lg px-4 py-3 text-sm outline-none focus:border-brand"></textarea><p class="cf-err text-red-500 text-xs mt-1 hidden">Tell us a little about your needs.</p></div>
          <button type="submit" class="rounded-full bg-ink text-white font-semibold px-8 py-3.5 hover:bg-brand transition-colors">Book Free Demo →</button>
          <p id="cfSuccess" class="text-good text-sm font-medium hidden">✓ Thanks — we've noted your details and will reach out shortly.</p>
        </form>
      </div>
    </div>
  </section>`;
}

document.addEventListener('submit', (e)=>{
  if(e.target.id!=='contactForm') return;
  e.preventDefault();
  const name=document.getElementById('cf-name'), company=document.getElementById('cf-company'), email=document.getElementById('cf-email'), msg=document.getElementById('cf-msg');
  document.querySelectorAll('.cf-err').forEach(x=>x.classList.add('hidden'));
  [name,company,email,msg].forEach(f=>f.classList.remove('border-red-400'));
  let valid=true;
  if(name.value.trim().length<2){ name.nextElementSibling.classList.remove('hidden'); name.classList.add('border-red-400'); valid=false; }
  if(company.value.trim().length<2){ company.nextElementSibling.classList.remove('hidden'); company.classList.add('border-red-400'); valid=false; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())){ email.nextElementSibling.classList.remove('hidden'); email.classList.add('border-red-400'); valid=false; }
  if(msg.value.trim().length<5){ msg.nextElementSibling.classList.remove('hidden'); msg.classList.add('border-red-400'); valid=false; }
  if(!valid) return;
  document.getElementById('cfSuccess').classList.remove('hidden');
  e.target.reset();
});
